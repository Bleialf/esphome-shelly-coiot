# =============================================================================
#  Shelly 3EM  ->  CoIoT (push, kein Polling)  ->  WireGuard  ->  Home Assistant
#
#  Der ESP steht im LAN beim Shelly, HA laeuft daheim auf 192.168.1.50 hinter

#
#  Es gibt bewusst KEINE konfigurierte Shelly-IP: der ESP hoert die CoIoT-
#  Multicast-Pakete mit, die der Shelly von sich aus alle 15 s (und bei jeder
#  Aenderung) verschickt. Die IP kommt aus der Absenderadresse des Pakets, die
#  Geraetezuordnung aus der MAC in CoAP-Option 3332. DHCP-Wechsel = egal.
# =============================================================================

substitutions:
  name: shelly3em-bridge
  friendly_name: "Shelly 3EM"
  # MAC des Shelly 3EM, OHNE Doppelpunkte oder mit - beides wird akzeptiert.
  # Findest du im Shelly-Webinterface unter Settings -> Device Info, oder
  # ganz unten im ESPHome-Log (die Komponente loggt jede gesehene Device-ID).
  shelly_mac: "A4CF12345678"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  # ESP32-C3 SuperMini
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Die CoIoT-Komponente wird beim Build direkt aus dem Repo geholt --
# im ESPHome-Container muss dafuer nichts kopiert oder gemountet werden.
external_components:
  - source:
      type: git
      url: https://github.com/kevinjanisch/esphome-shelly-coiot
      ref: main
    components: [shelly_coiot]

logger:
  level: INFO
  # Der C3 SuperMini hat keinen echten UART-Header rausgefuehrt; ueber USB-CDC
  # loggen. Wenn du ueber die WG-Verbindung loggst, kann das hier auch weg.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # OTA durch den Tunnel: erst flashen wenn der Tunnel steht, DANN die
  # naechste Zeile einkommentieren. Sie sagt ESPHome, unter welcher Adresse
  # das Geraet fuers Hochladen zu erreichen ist -- mDNS geht durch WireGuard
  # nicht. Beim allerersten Flash per USB muss sie auskommentiert bleiben.
  # use_address: 10.8.0.7
  ap:
    ssid: "${name} Fallback"
    password: !secret fallback_password

captive_portal:

# -----------------------------------------------------------------------------
# Zeit -- WireGuard braucht eine korrekte Uhr, sonst schlaegt der Handshake fehl.
# Bewusst SNTP und NICHT time.homeassistant: HA ist erst durch den Tunnel
# erreichbar, den wir gerade aufbauen wollen. Henne-Ei.
# -----------------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.at.pool.ntp.org
      - 1.at.pool.ntp.org
      - pool.ntp.org

# -----------------------------------------------------------------------------
# WireGuard -- aus einer normalen wg-Client-Config abgeleitet, mit zwei
# Korrekturen, die fuer diesen Anwendungsfall noetig sind:
#
#   1. AllowedIPs war 0.0.0.0/0. Damit wuerde der ESP saemtlichen Verkehr in
#      den Tunnel schicken und kaeme nicht mehr an den Shelly im lokalen Netz
#      (und der IGMP-Join fuer Multicast landet auf dem falschen Interface).
#      Deshalb nur das, was wirklich durch den Tunnel muss.
#   2. PersistentKeepalive war 0. Ohne Keepalive macht die NAT-Tabelle des
#      Routers am entfernten Standort nach ein paar Minuten dicht und HA kommt
#      nicht mehr zum ESP durch. 25 s ist der uebliche Wert.
#
# Der IPv6-Teil (fdcc:.../128) und DNS = werden von esp_wireguard ignoriert.
# -----------------------------------------------------------------------------
wireguard:
  address: 10.8.0.7
  netmask: 255.255.255.255
  private_key: !secret wg_private_key
  peer_endpoint: vpn.example.com
  peer_port: 51820
  peer_public_key: !secret wg_peer_public_key
  peer_preshared_key: !secret wg_preshared_key
  peer_persistent_keepalive: 25s
  peer_allowed_ips:
    - 10.8.0.0/24        # das Tunnelnetz selbst
    - 192.168.1.50/32    # Home Assistant
  # Nicht auf true setzen: der Shelly soll auch dann ausgelesen werden, wenn
  # der Tunnel gerade haengt. Die Werte laufen dann in den Puffer von HA nach.
  require_connection_to_proceed: false

# -----------------------------------------------------------------------------
# Native API. HA verbindet sich auf 10.8.0.7:6053 -- die mDNS-Autodiscovery
# funktioniert durch den Tunnel nicht, das Geraet wird in HA einmal von Hand
# ueber "ESPHome -> Add device -> 10.8.0.7" hinzugefuegt.
# -----------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  # Nicht neu starten, nur weil HA mal 15 Minuten weg ist -- der ESP soll
  # weiter zuhoeren.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# =============================================================================
#  CoIoT-Listener
# =============================================================================
shelly_coiot:
  id: shelly3em
  mac: ${shelly_mac}
  model: "SHEM-3"
  # Shelly sendet per Default alle 15 s. 60 s = vier verpasste Pakete, bevor
  # wir das Geraet als offline melden.
  timeout: 60s
  mark_unavailable_on_timeout: true

sensor:
  - platform: shelly_coiot
    shelly_coiot_id: shelly3em

    phase_a:
      power:
        name: "L1 Leistung"
      voltage:
        name: "L1 Spannung"
      current:
        name: "L1 Strom"
      power_factor:
        name: "L1 Leistungsfaktor"
      energy:
        name: "L1 Energie bezogen"
      energy_returned:
        name: "L1 Energie eingespeist"

    phase_b:
      power:
        name: "L2 Leistung"
      voltage:
        name: "L2 Spannung"
      current:
        name: "L2 Strom"
      power_factor:
        name: "L2 Leistungsfaktor"
      energy:
        name: "L2 Energie bezogen"
      energy_returned:
        name: "L2 Energie eingespeist"

    phase_c:
      power:
        name: "L3 Leistung"
      voltage:
        name: "L3 Spannung"
      current:
        name: "L3 Strom"
      power_factor:
        name: "L3 Leistungsfaktor"
      energy:
        name: "L3 Energie bezogen"
      energy_returned:
        name: "L3 Energie eingespeist"

    # Summen ueber alle drei Phasen, im ESP gerechnet. total_energy /
    # total_energy_returned sind die beiden Entitaeten, die du im HA-
    # Energie-Dashboard brauchst (state_class: total_increasing).
    total_power:
      name: "Gesamtleistung"
    total_energy:
      name: "Gesamtenergie bezogen"
    total_energy_returned:
      name: "Gesamtenergie eingespeist"

  # WLAN-Qualitaet des ESP -- beim C3 SuperMini durchaus einen Blick wert,
  # die Onboard-Antenne ist bekanntermassen schwach.
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: shelly_coiot
    shelly_coiot_id: shelly3em
    relay:
      name: "Shelly Relais"
    overpower:
      name: "Shelly Ueberlast"
    online:
      name: "Shelly erreichbar"

  # Status des Tunnels selbst.
  - platform: wireguard
    status:
      name: "WireGuard verbunden"
    enabled:
      name: "WireGuard aktiv"

text_sensor:
  # Das hier ist die sichtbare Seite der Discovery: die aktuell gefundene IP
  # des Shelly und seine CoIoT-Device-ID. Beides aktualisiert sich von selbst,
  # wenn der Shelly eine neue DHCP-Lease bekommt.
  - platform: shelly_coiot
    shelly_coiot_id: shelly3em
    ip_address:
      name: "Shelly IP"
    device_id:
      name: "Shelly Device ID"

  - platform: wireguard
    address:
      name: "WireGuard Adresse"

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
